<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Spinning Donut</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Prevent scrollbars */
        html, body {
            overflow: hidden;
        }

        /* --- Donut Styles --- */
        .donut-body {
            /* The main ring shape */
            width: 200px;
            height: 200px;
            background-color: #f7a8b8; /* Pink Icing Color */
            border-radius: 50%;
            border: 20px solid #f8e1a8; /* Dough Color */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); /* Soft shadow */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 6s linear infinite; /* Slow, continuous spin */
            will-change: transform;
        }

        .donut-hole {
            /* The central hole */
            width: 80px;
            height: 80px;
            background-color: #fcf6e7; /* Hole color (light dough) */
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1); /* Inner shadow for depth */
        }

        /* --- Sprinkles --- */
        /* Sprinkles are absolutely positioned elements */
        .sprinkle {
            position: absolute;
            width: 6px;
            height: 14px;
            background-color: white;
            border-radius: 2px;
            opacity: 0.9;
        }

        /* Sprinkle specific positions and colors */
        .s1 { top: 15px; left: 50px; background-color: #f43f5e; transform: rotate(15deg); } /* Red */
        .s2 { top: 25px; right: 30px; background-color: #3b82f6; transform: rotate(-45deg); } /* Blue */
        .s3 { bottom: 40px; left: 20px; background-color: #10b981; transform: rotate(70deg); } /* Green */
        .s4 { bottom: 10px; right: 60px; background-color: #f59e0b; transform: rotate(-20deg); } /* Yellow */
        .s5 { top: 50%; left: 10px; background-color: #ec4899; transform: rotate(90deg); } /* Pink */
        .s6 { top: 10px; left: 110px; background-color: #a78bfa; transform: rotate(-5deg); } /* Lavender */
        .s7 { bottom: 20px; left: 130px; background-color: #f43f5e; transform: rotate(30deg); } /* Red */
        .s8 { top: 60px; right: 5px; background-color: #10b981; transform: rotate(-80deg); } /* Green */
        .s9 { top: 100px; left: 10px; background-color: #3b82f6; transform: rotate(45deg); } /* Blue */
        .s10 { bottom: 80px; right: 10px; background-color: #f59e0b; transform: rotate(120deg); } /* Yellow */


        /* --- Keyframe Animation --- */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header Section -->
    <header class="text-center mb-12">
        <h1 class="text-5xl sm:text-6xl font-extrabold tracking-tight text-pink-600">
            The Spinning Donut
        </h1>
        <p class="mt-3 text-gray-700 text-xl">
            A delicious, perpetually rotating treat!
        </p>
    </header>

    <!-- Donut Visualization -->
    <div class="donut-body">
        <!-- Sprinkles inside the donut-body (icing area) -->
        <div class="sprinkle s1"></div>
        <div class="sprinkle s2"></div>
        <div class="sprinkle s3"></div>
        <div class="sprinkle s4"></div>
        <div class="sprinkle s5"></div>
        <div class="sprinkle s6"></div>
        <div class="sprinkle s7"></div>
        <div class="sprinkle s8"></div>
        <div class="sprinkle s9"></div>
        <div class="sprinkle s10"></div>

        <!-- The hole in the center of the donut -->
        <div class="donut-hole"></div>
    </div>

    <!-- Footer/Hint Section -->
    <footer class="mt-12 text-center text-gray-500 max-w-lg">
        <p class="text-sm">
            This visualization uses CSS borders and `border-radius: 50%` to create the torus (donut) shape, while absolutely positioned elements act as the sprinkles.
        </p>
    </footer>

</body>
</html>
